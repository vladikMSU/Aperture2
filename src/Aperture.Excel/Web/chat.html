<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Aperture</title>
  <link rel="stylesheet" href="chat.css">
  <script src="chat.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="context-row">
      <div class="workbook" title="Книга закреплена за этим чатом. Переключение окна её не меняет.">
        <span class="workbook-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 2.5h10a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16V4A1.5 1.5 0 0 1 5 2.5Z"/><path d="M4 7h12M8 7v10M4 12h12"/></svg></span>
        <span id="workbook-name">Книга не привязана</span>
        <span class="pin" aria-label="Закреплена"><svg viewBox="0 0 20 20"><path d="m12 3 5 5-3 .5-3 3-.5 3-5-5 3-.5 3-3ZM7 13l-4 4"/></svg></span>
      </div>
        <button id="settings" class="icon-button" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9.5 3-.7 2.2-2 .9-2.1-.5-2 3.5L4.2 11v2l-1.5 1.9 2 3.5 2.1-.5 2 .9.7 2.2h5l.7-2.2 2-.9 2.1.5 2-3.5-1.5-1.9v-2l1.5-1.9-2-3.5-2.1.5-2-.9L14.5 3Z"/></svg></button>
      </div>
      <nav class="toolbar" aria-label="Действия чата">
        <button id="new-chat" class="text-button"><span aria-hidden="true">＋</span> Новый чат</button>
        <button id="rebind" class="text-button" title="Привязать текущую книгу к новому чату"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 7a6 6 0 0 0-10-1.5L3 8m0-5v5h5m-3.5 5a6 6 0 0 0 10 1.5L17 12m0 5v-5h-5"/></svg> Сменить книгу</button>
      </nav>
    </header>
    <section id="conversation" class="conversation" role="log" aria-label="Переписка" aria-live="polite" aria-relevant="additions">
      <div id="welcome" class="welcome">
        <div class="welcome-glyph" aria-hidden="true">✳</div>
        <h1>Разберёмся в модели</h1>
        <p>Задайте вопрос о книге или попросите проверить расчёты.</p>
        <div class="suggestions">
          <button data-prompt="Опиши структуру этой финансовой модели и связи между листами."><span class="suggestion-icon" aria-hidden="true">▦</span><span>Разобраться в структуре</span><span class="suggestion-arrow" aria-hidden="true">↗</span></button>
          <button data-prompt="Проверь формулы и найди возможные ошибки. Не изменяй исходные расчёты."><span class="suggestion-icon" aria-hidden="true">ƒ</span><span>Проверить формулы</span><span class="suggestion-arrow" aria-hidden="true">↗</span></button>
          <button data-prompt="Проведи аудит ключевых допущений финансовой модели. Указывай ссылки на ячейки."><span class="suggestion-icon" aria-hidden="true">⌕</span><span>Провести аудит модели</span><span class="suggestion-arrow" aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div id="messages"></div>
    </section>
    <footer class="footer">
      <div id="status" class="status" role="status"><span class="status-dot"></span><span id="status-text">Готова к работе</span></div>
      <div class="composer">
        <textarea id="prompt" rows="3" maxlength="100000" aria-label="Сообщение" placeholder="Спросите о вашей модели…" spellcheck="false"></textarea>
        <div class="composer-actions"><span class="shortcut">Ctrl + Enter <span>отправить</span></span><button id="stop" class="stop-button" hidden><span class="stop-square" aria-hidden="true"></span> Стоп</button><button id="send" class="send-button" aria-label="Отправить сообщение" title="Отправить · Ctrl+Enter"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m-4 4 4-4 4 4"/></svg></button></div>
      </div>
      <div class="footer-note">Работает с открытой книгой <span>·</span> Pi agent</div>
    </footer>
  </main>
</body>
</html>
