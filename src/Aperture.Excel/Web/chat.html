<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Aperture</title>
  <link rel="stylesheet" href="chat.css">
  <script src="chat.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <nav class="toolbar" aria-label="Действия чата">
        <button id="new-chat" class="icon-button" title="Новый чат" aria-label="Новый чат"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="settings" class="icon-button" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.1"/><path d="M6.9 1.8h2.2l.4 1.7 1.1.6 1.7-.5 1.1 1.9-1.3 1.2v1.3l1.3 1.2-1.1 1.9-1.7-.5-1.1.6-.4 1.7H6.9l-.4-1.7-1.1-.6-1.7.5-1.1-1.9 1.3-1.2V7.4L2.6 6.2l1.1-1.9 1.7.5 1.1-.6z"/></svg></button>
      </nav>
    </header>
    <section id="conversation" class="conversation" role="log" aria-label="Переписка" aria-live="polite" aria-relevant="additions">
      <div id="welcome" class="welcome">
        <h1>Разберёмся в модели</h1>
        <p>Задайте вопрос об этой книге. Обычные правки — по вашей просьбе, аудит сам по себе ничего не меняет.</p>
        <div class="suggestions">
          <button data-prompt="Опиши структуру этой финансовой модели и связи между листами."><span>Разобраться в структуре</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
          <button data-prompt="Проверь формулы и найди возможные ошибки. Не изменяй исходные расчёты."><span>Проверить формулы</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
          <button data-prompt="Проведи аудит ключевых допущений финансовой модели. Указывай ссылки на ячейки."><span>Аудит допущений</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
        </div>
      </div>
      <div id="messages"></div>
    </section>
    <footer class="footer">
      <div class="composer">
        <textarea id="prompt" rows="1" maxlength="100000" aria-label="Сообщение" placeholder="Спросите о модели…" spellcheck="false"></textarea>
        <div class="composer-bar">
          <button id="stop" class="stop-button" title="Остановить" aria-label="Остановить" hidden><span aria-hidden="true"></span></button>
          <button id="send" class="send-button" title="Отправить · Enter" aria-label="Отправить сообщение"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.8 7.5 8 3.3l4.2 4.2"/></svg></button>
        </div>
      </div>
    </footer>
  </main>
</body>
</html>
